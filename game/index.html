		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #0d0f0a;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

<style>
html,body{overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;position:fixed;inset:0;overflow:hidden}
#boot{position:fixed;inset:0;z-index:50;background:#0b0f0a url(index.png) center/cover no-repeat;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-family:system-ui,sans-serif;color:#fff;pointer-events:none}
#boot .box{width:min(560px,80vw);margin-bottom:7vh;background:rgba(0,0,0,.62);padding:14px 18px;border-radius:10px}
#boot .bar{height:10px;background:rgba(255,255,255,.2);border-radius:5px;overflow:hidden;margin-top:8px}
#boot .fill{height:100%;width:0;background:#f2a23a;transition:width .2s}
#boot .txt{font-size:16px}
#boot .sub{font-size:12px;opacity:.75;margin-top:6px}
</style>

<div id="boot"><div class="box"><div class="txt" id="boot-txt">Downloading…</div><div class="bar"><div class="fill" id="boot-fill"></div></div><div class="sub">Bad-ass Tankheads · first load is the slow one, later visits use the browser cache</div></div></div>
<script>
(function(){
  // keep hold of the game's audio context: unlock it on the first tap/click/key (phones need this),
  // and with ?audiodebug measure what actually reaches the speakers
  var AC=window.AudioContext||window.webkitAudioContext,dbg=location.search.indexOf('audiodebug')>=0;
  if(AC){
    var W=function(o){var c=new AC(o);(window.__actxs=window.__actxs||[]).push(c);
      if(dbg){var an=c.createAnalyser();an.fftSize=2048;c.__an=an;var z=c.createGain();z.gain.value=0;an.connect(z);z.connect(c.destination);}return c;};
    W.prototype=AC.prototype;window.AudioContext=W;window.webkitAudioContext=W;
    if(dbg){var oc=AudioNode.prototype.connect;AudioNode.prototype.connect=function(d){
      if(d&&d===this.context.destination&&this.context.__an&&this!==this.context.__an){try{oc.call(this,this.context.__an);}catch(e){}}
      return oc.apply(this,arguments);};
      window.__audioPeak=function(){return (window.__actxs||[]).map(function(c){var b=new Float32Array(2048),p=0;if(c.__an){c.__an.getFloatTimeDomainData(b);for(var i=0;i<b.length;i++)p=Math.max(p,Math.abs(b[i]));}return {state:c.state,peak:p,rate:c.sampleRate};});};}
    var un=function(){(window.__actxs||[]).forEach(function(c){if(c.state!=='running'&&c.resume)c.resume();});};
    ['pointerdown','pointerup','touchstart','touchend','mousedown','click','keydown'].forEach(function(e){window.addEventListener(e,un,true);});
  }
  var t0=Date.now(),done=false,txt=document.getElementById('boot-txt'),fill=document.getElementById('boot-fill');
  window.__gameReady=function(){done=true;var b=document.getElementById('boot');if(b)b.remove();};
  var iv=setInterval(function(){
    if(done){clearInterval(iv);return;}
    var s=Math.round((Date.now()-t0)/1000),p=document.getElementById('status-progress'),st=document.getElementById('status');
    if(st&&p&&p.hasAttribute('value')&&p.max>0&&p.value<p.max){var pc=Math.round(100*p.value/p.max);txt.textContent='Step 1 of 3 · Downloading '+pc+'%';fill.style.width=(pc*0.6)+'%';}
    else if(st){txt.textContent='Step 2 of 3 · Starting the engine… '+s+' s';fill.style.width='70%';}
    else{txt.textContent='Step 3 of 3 · Loading the level and compiling shaders… '+s+' s';fill.style.width=Math.min(98,75+s/2)+'%';}
  },200);
})();
</script>

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":34369792,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
